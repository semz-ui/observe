services:
  postgres:
    image: postgres:16
    container_name: observe-db
    environment:
      POSTGRES_USER: observe
      POSTGRES_PASSWORD: observe
      POSTGRES_DB: observe
    ports:
      # 5433 on the host — local Homebrew Postgres owns 5432
      - '5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U observe -d observe']
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - observe-pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: observe-redis
    ports:
      # 6380 on the host — another local container already publishes 6379
      - '6380:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5
    # no volume: it holds caches and rate-limit counters only — safe to lose

volumes:
  observe-pgdata:
