name: Claude Code PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  pull_request_review_comment:
    types: [created]
  issue_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

jobs:
  # Job 1: Automatic inline code review on PR open/update
  auto-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Inline Code Review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          track_progress: true
          show_full_output: true
          classify_inline_comments: 'true'
          include_fix_links: 'true'
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            PR TITLE: ${{ github.event.pull_request.title }}
            PR BODY: ${{ github.event.pull_request.body }}

            You are a senior code reviewer for an EdTech API built with NestJS, TypeScript, GraphQL, and Prisma following Clean Architecture and DDD patterns.

            ## Your Task

            Review this pull request by posting **inline comments on specific lines of changed code**, exactly like a human reviewer would. Do NOT post a single summary comment — use inline comments on the actual diff lines.

            ## Review Process

            1. **Read project standards**: Read `agent.md` and `CLAUDE.md` from the repository root to understand all coding standards, architecture rules, and review criteria for this project.

            2. **Get the PR diff**: Run `gh pr diff ${{ github.event.pull_request.number }}` to retrieve the full diff and understand exactly which files and lines were changed.

            3. **Analyze changed files**: For each changed file, use `Read` to examine the full file context (not just the diff). Use `Grep` and `Glob` to trace dependencies, check import directions, and verify architectural compliance.

            4. **Post inline comments**: For each issue found, use the `mcp__github_inline_comment__create_inline_comment` tool to post a comment on the specific file and line where the issue exists. Set `confirmed: true` on each comment. Each comment must be:
               - Posted on a line that is part of the diff (a changed line)
               - Prefixed with a severity label: `**[Critical]**`, `**[Major]**`, `**[Minor]**`, or `**[Suggestion]**`
               - Specific and actionable — reference the exact code and explain WHY it is an issue
               - Include a suggested fix or code snippet when possible

            ## Review Criteria

            Check each changed file against these project standards:

            ### Clean Architecture
            - Dependencies point inward only: Infrastructure → Application → Domain
            - Domain files must NOT import from `@nestjs/`, `@prisma/`, `application/`, or `infrastructure/`
            - Application files must NOT import from `@prisma/` or `infrastructure/`
            - Infrastructure implements port interfaces from the application layer

            ### SOLID Principles
            - Single Responsibility: each class/file has one clear purpose
            - Open/Closed: new behavior via new classes, not modifying existing ones
            - Interface Segregation: port interfaces are small and focused
            - Dependency Inversion: services depend on port interfaces, not concrete repositories

            ### Error Handling
            - Domain errors defined for each failure mode (`Create[X]Error`, `Update[X]Error`)
            - Domain errors extend `GraphQLError` with `extensions.code` and `extensions.statusCode`
            - Services wrap errors in try-catch with domain error classes
            - No bare `throw new Error()` — always use domain-specific error classes

            ### TypeScript
            - No `any` types without justification
            - `import type` used for type-only imports
            - All function parameters and return types explicitly typed
            - Null/undefined handled with optional chaining and null checks

            ### Naming Conventions
            - Files: `kebab-case` with type suffix (`.entity.ts`, `.service.ts`, `.resolver.ts`)
            - Classes: `PascalCase` with type suffix (`ProfileEntity`, `ProfileService`)
            - Interfaces: `PascalCase` with `I` prefix for ports (`IProfileRepository`)
            - Methods: `camelCase`, verbs first (`create`, `findById`, `update`, `delete`)
            - Enums: `PascalCase` name, `UPPER_SNAKE_CASE` values
            - DI tokens: string matching interface name (`'IProfileRepository'`)

            ### Entity & Domain Rules
            - Private constructor — entities created only via `static create()`
            - Immutable updates — `update()` returns a new instance, not `this`
            - UUID generated in `create()` if not provided
            - No infrastructure imports in domain entities

            ### Security
            - `@UseGuards(AuthGuard, GqlThrottlerGuard)` on all protected resolvers
            - `@CurrentUser('authId')` to extract user identity
            - Input types have `class-validator` decorators (`@IsNotEmpty()`, `@IsOptional()`)
            - No sensitive data (API keys, passwords, connection strings) in code

            ### GraphQL
            - Proper type definitions with descriptions
            - `@Field` nullability matches entity definition
            - Enums registered with `registerEnumType()` in the enum file
            - Input validation decorators present

            ### Testing
            - Unit tests exist for new/modified code
            - Arrange-Act-Assert pattern followed
            - `faker` used for test data (no hardcoded values)
            - `afterEach(() => jest.clearAllMocks())` in every `describe` block
            - Error cases tested

            ## Rules

            - ONLY comment on lines that are part of the diff (changed or added lines)
            - Focus on bugs, architecture violations, security issues, and SOLID violations — not style nitpicks
            - If no issues are found, do NOT post any comments at all. Only comment when there is an actionable issue that requires a code change.
            - Do NOT post approval comments, "LGTM" comments, acknowledgment comments, or praise comments. The only reason to comment is to request a change.
            - Be constructive, not nitpicky
            - Verify changes align with the PR title and description
            - Use `confirmed: true` on every inline comment
          claude_args: |
            --max-turns 50
            --model claude-sonnet-4-5-20250929
            --allowedTools "Read,Grep,Glob,mcp__github_inline_comment__create_inline_comment,Bash(gh pr diff:*),Bash(gh pr view:*)"

  # Job 2: Interactive @claude mentions (reply to inline comments)
  interactive:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Respond to @claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: |
            --max-turns 50
            --model claude-sonnet-4-5-20250929
            --allowedTools Read,Grep,Glob
