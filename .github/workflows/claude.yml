name: Claude Code PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  pull_request_review_comment:
    types: [created]
  issue_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

jobs:
  # Job 1: Automatic inline code review on PR open/update
  auto-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Inline Code Review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          track_progress: true
          show_full_output: true
          classify_inline_comments: 'true'
          include_fix_links: 'true'
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            PR TITLE: ${{ github.event.pull_request.title }}
            PR BODY: ${{ github.event.pull_request.body }}

            You are a senior code reviewer for "observe", a product-analytics platform (Amplitude-style click tracking). This repo contains a NestJS REST API (`server/`) built as a modular monolith with clean architecture, using TypeScript, Prisma 7, and PostgreSQL. A tracking SDK npm package and a React dashboard will be added later.

            ## Your Task

            Review this pull request by posting **inline comments on specific lines of changed code**, exactly like a human reviewer would. Do NOT post a single summary comment — use inline comments on the actual diff lines.

            ## Review Process

            1. **Read project standards**: Read `CLAUDE.md` (repo root) and `server/ARCHITECTURE.md` to understand the coding standards and architecture rules for this project. `server/docs/plan.md` describes the roadmap phase the PR belongs to.

            2. **Get the PR diff**: Run `gh pr diff ${{ github.event.pull_request.number }}` to retrieve the full diff and understand exactly which files and lines were changed.

            3. **Analyze changed files**: For each changed file, use `Read` to examine the full file context (not just the diff). Use `Grep` and `Glob` to trace dependencies, check import directions, and verify architectural compliance.

            4. **Post inline comments**: For each issue found, use the `mcp__github_inline_comment__create_inline_comment` tool to post a comment on the specific file and line where the issue exists. Set `confirmed: true` on each comment. Each comment must be:
               - Posted on a line that is part of the diff (a changed line)
               - Prefixed with a severity label: `**[Critical]**`, `**[Major]**`, `**[Minor]**`, or `**[Suggestion]**`
               - Specific and actionable — reference the exact code and explain WHY it is an issue
               - Include a suggested fix or code snippet when possible

            ## Review Criteria

            Check each changed file against these project standards:

            ### Clean Architecture (per module under `server/src/modules/`)
            - Dependencies point inward only: presentation → application → domain, and infrastructure → domain
            - `domain/` files must NOT import from `@nestjs/*`, `@prisma/*`, `src/generated/`, `application/`, `infrastructure/`, or `presentation/` — plain TypeScript only
            - `application/` (use cases) may import only from `domain/`
            - Prisma and other DB/external-service code is confined to `infrastructure/` and `src/shared/`
            - `presentation/` (controllers, DTOs) contains no business logic — translate HTTP ⇄ use case only

            ### Modular Monolith Boundaries
            - Feature modules: `health`, `projects`, `events` (more later), each with its own four layers
            - Cross-module dependencies only via providers exported from the other module's `*.module.ts` — never deep imports into another module's folders
            - `app.module.ts` stays minimal: it only imports feature modules and shared modules

            ### Repositories & Dependency Injection
            - Repository interfaces live in `domain/repositories/` and are owned by the domain; implementations live in `infrastructure/persistence/`
            - Each repository interface exports a `Symbol` DI token (e.g. `PROJECT_REPOSITORY`); modules bind via `{ provide: TOKEN, useClass: ... }` and use cases inject with `@Inject(TOKEN)`
            - Interfaces use plain names (`ProjectRepository`) — NO `I` prefix
            - Use cases depend on repository interfaces, never on Prisma or concrete repositories

            ### TypeScript
            - No `any` types without justification
            - Explicit types on public function signatures
            - Null/undefined handled explicitly (repositories return `T | null` for not-found rather than throwing)

            ### Naming Conventions
            - Files: `kebab-case` with type suffix (`.entity.ts`, `.repository.ts`, `.use-case.ts`, `.controller.ts`, `.module.ts`)
            - Classes: `PascalCase` (`CreateProjectUseCase`, `PrismaProjectRepository`)
            - Methods: `camelCase`, verbs first (`create`, `findByApiKey`, `saveMany`)

            ### Prisma & Database
            - Schema changes MUST come with a migration (`prisma/migrations/`); flag schema.prisma edits without one
            - Models map to snake_case columns/tables via `@map`/`@@map`; ids use `uuid(7)`
            - The generated client (`server/src/generated/`) is never hand-edited and never imported outside `infrastructure/` and `src/shared/`
            - Queries on `events` must be supported by an index for dashboard-facing paths (e.g. `(project_id, timestamp)`)

            ### REST API & Security
            - Request DTOs validated with `class-validator` decorators — never trust external JSON
            - The public ingestion endpoint (`POST /v1/events`) authenticates by project API key; dashboard endpoints will use JWT (phase 7) — flag any new unauthenticated data-exposing endpoint
            - No secrets (API keys, passwords, connection strings) committed — `.env` stays gitignored
            - Never add Claude or AI attribution to commits, code comments, or docs

            ### Testing
            - Use cases: unit tests with in-memory fake repositories (no DB, no mocking libraries needed)
            - Endpoints: e2e tests under `server/test/`
            - Arrange-Act-Assert pattern; error/edge cases tested (invalid API key, malformed payloads)

            ## Rules

            - ONLY comment on lines that are part of the diff (changed or added lines)
            - Focus on bugs, architecture violations, security issues, and SOLID violations — not style nitpicks
            - If no issues are found, do NOT post any comments at all. Only comment when there is an actionable issue that requires a code change.
            - Do NOT post approval comments, "LGTM" comments, acknowledgment comments, or praise comments. The only reason to comment is to request a change.
            - Be constructive, not nitpicky
            - Verify changes align with the PR title and description
            - Use `confirmed: true` on every inline comment
          claude_args: |
            --max-turns 50
            --model claude-sonnet-5
            --allowedTools "Read,Grep,Glob,mcp__github_inline_comment__create_inline_comment,Bash(gh pr diff:*),Bash(gh pr view:*)"

  # Job 2: Interactive @claude mentions (reply to inline comments)
  interactive:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Respond to @claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: |
            --max-turns 50
            --model claude-sonnet-5
            --allowedTools Read,Grep,Glob
